# ============================================================
#  作品集清單
#  新增作品 = 在下面複製一段,改內容。不用碰 HTML。
#
#  每個欄位:
#    title    必填  作品名稱
#    desc     必填  一句話形容這個遊戲(卡片上字多會難讀,細節留給 itch.io 頁面)
#    cover    選填  封面圖,放在 source/asset/portfolio/ 底下
#                   例如放了 mygame.jpg 就寫 /asset/portfolio/mygame.jpg
#                   留空的話會顯示漸層底 + 作品名稱
#    year     選填  年份,顯示在卡片角落
#    role     選填  你在這個專案的角色
#    tags     選填  玩法標籤(解謎、平台跳躍…),會顯示成小圓角標籤
#    links    選填  按鈕連結,想放幾個都行
#             每個連結有 text(按鈕文字)和 url
#    featured 選填  設 true 會出現在首頁的「精選作品」輪播,並在作品集排最前面
#                   建議只給 2~3 個最想讓人先看到的作品
#
#  ⚠️ YAML 格式提醒:縮排一律用「空格」不要用 Tab,
#     冒號後面要留一個空格。
#  ⚠️ 預覽時改這個檔案「不會」自動更新:要先按 Ctrl+C 關掉 hexo server 再重開。
# ============================================================

