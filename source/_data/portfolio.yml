# ============================================================
#  作品集清單
#  新增作品 = 在下面複製一段,改內容。不用碰 HTML。
#
#  每個欄位:
#    title    必填  作品名稱
#    desc     必填  一到兩句話的簡介
#    cover    選填  封面圖,放在 source/img/portfolio/ 底下
#                   例如放了 mygame.png 就寫 /img/portfolio/mygame.png
#                   留空的話會顯示漸層底 + 作品名稱
#    year     選填  年份,顯示在卡片角落
#    role     選填  你在這個專案的角色
#    tags     選填  技術/類型標籤,會顯示成小圓角標籤
#    links    選填  按鈕連結,想放幾個都行
#             每個連結有 text(按鈕文字)和 url
#    featured 選填  設 true 會排在最前面並加寬顯示
#
#  ⚠️ YAML 格式提醒:縮排一律用「空格」不要用 Tab,
#     冒號後面要留一個空格。改完存檔後重新整理瀏覽器就能看到。
# ============================================================

# 👇 這是佔位用的空白卡片。填上你第一個作品之後,把 title/desc 改掉即可。
#    暫時不想顯示任何東西的話,把下面整段刪掉,頁面會顯示「還沒有作品」。
- title: 作品準備中
  desc: 這張是佔位卡片。把它改成你的第一個作品,或整段刪掉。
  cover:
  year: 2026
  tags: []
  links: []


