name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # 允許在 GitHub 網頁上手動觸發部署
  workflow_dispatch:

# GitHub Pages 官方部署方式必要的權限,少了會出現 403
permissions:
  contents: read
  pages: write
  id-token: write

# 同時只跑一個部署,但不取消進行中的,避免部署到一半被中斷
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # 使用 package-lock.json 精準安裝,確保 CI 與本機版本一致
      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npx hexo generate

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
