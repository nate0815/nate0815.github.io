name: Build check

# PR 合併前先確認網站還能正常產生。只檢查,不部署 ——
# 部署仍然只在推上 main 時由 deploy.yml 做。
#
# 為什麼需要這道:Hexo 有不少靜默失敗(build 成功、但頁面是空的),
# 而 main 一合併就上線,壞掉的話訪客會直接看到。所以除了 build 不能報錯,
# 還要檢查幾個「壞掉時會悄悄消失」的東西真的有產生出來。
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npx hexo generate

      # 每一項都對應一種已知的靜默失敗,見 doc/TECH.md「已知的坑」
      - name: Check generated pages
        run: |
          fail=0
          need() {  # need <檔案> <要出現的字串> <說明>
            if [ ! -s "$1" ]; then
              echo "::error::$1 沒有產生或是空的($3)"; fail=1
            elif ! grep -q -- "$2" "$1"; then
              echo "::error::$1 裡找不到 $2($3)"; fail=1
            else
              echo "ok  $1  ←  $3"
            fi
          }
          need public/index.html          'na-feat'         '首頁精選作品(home-feature.js)'
          need public/index.html          'custom.css?v='   '自訂 CSS 的版本號(cache-bust.js)'
          need public/portfolio/index.html 'class="pf-card' '作品集卡片(portfolio.js 讀 portfolio.yml)'
          need public/about/index.html    'class="na-support' '關於頁的贊助按鈕'
          exit $fail
